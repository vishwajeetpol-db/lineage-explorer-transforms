bundle:
  name: bricktrace

variables:
  warehouse_id:
    description: "SQL Warehouse ID for executing queries (required)"
  cache_ttl_seconds:
    description: "Cache TTL in seconds for lineage data"
    default: "28800"
  cache_max_memory_mb:
    description: "Max in-memory cache footprint in MB"
    default: "250"
  admin_group_name:
    description: "Workspace group whose members are treated as admins"
    default: "admins"
  rate_limit_max_requests:
    description: "Max requests per user per window"
    default: "60"
  rate_limit_window_seconds:
    description: "Rate-limit window in seconds"
    default: "60"
  lineage_window_days:
    description: "Lookback window (days) for system.access lineage queries"
    default: "365"
  cost_cache_ttl_seconds:
    description: "TTL (seconds) for the per-entity serverless-cost cache; billing rolls up daily"
    default: "21600"
  lineage_catalog:
    description: "Catalog where transformation lineage Delta tables are stored"
    default: "lattice_lineage"
  lineage_schema:
    description: "Schema within lineage_catalog for transformation lineage tables"
    default: "lineage"
  pipeline_notebook_path:
    description: "Workspace path to the run_all notebook for building transformation lineage"
    default: ""
  captured_plans_table:
    description: "Delta table the lineage_capture wheel writes analyzed plans to (override if capture lands outside the app-owned schema)"
    default: "lattice_lineage.lineage.captured_plans"
  captured_cdc_table:
    description: "Delta table for captured apply_changes/AUTO-CDC specs"
    default: "lattice_lineage.lineage.captured_cdc_specs"
  transform_cache_ttl_seconds:
    description: "TTL (seconds) for transformation lineage cache (shorter than table lineage)"
    default: "3600"
  build_cache_ttl_hours:
    description: "Hours before transformation lineage is considered stale and needs rebuild"
    default: "24"
  warehouse_max_concurrent_statements:
    description: "Max SQL statements the app will run at once. Size to the WAREHOUSE's real concurrency (cluster size x max clusters), not to the app's thread count — the app can present ~84 and a warehouse cluster admits ~10."
    default: "8"
  enforce_user_identity:
    description: "When true, data READS run as the calling user so Unity Catalog enforces them. Default false: every user currently sees whatever the app's service principal can read, and switching this on makes users see LESS. Validate against one catalog before enabling."
    default: "false"
  lineage_hop_max_rows:
    description: "Row cap per BFS hop when tracing lineage. Bounds hop WIDTH (a shared conformed dimension can have very many edges); hitting it is reported as a truncated graph."
    default: "5000"
  max_builds_in_flight:
    description: "Max concurrent transformation-lineage builds. Each is a serverless job."
    default: "5"
  max_builds_per_day:
    description: "Daily cap on transformation-lineage builds, across all admins."
    default: "200"
  llm_max_calls_per_user_per_day:
    description: "Daily per-user cap on AI analysis calls. The deep-analysis path is agentic, so one user action can be many model calls."
    default: "500"
  app_name:
    description: "Databricks App name. Override to avoid collisions in a shared workspace or to run multiple instances."
    default: "bricktrace"

# Files excluded from `databricks bundle deploy` uploads.
# `.databricksignore` is best-effort across CLI versions — `sync.exclude` is authoritative.
sync:
  exclude:
    - ".git"
    - ".gitignore"
    - ".databricks"
    - ".claude"
    - ".venv"
    - ".vscode"
    - ".idea"
    - "**/__pycache__"
    - "**/*.pyc"
    - "**/.DS_Store"
    - "frontend/node_modules"
    - "frontend/src"
    - "frontend/public"
    - "frontend/index.html"
    - "frontend/package.json"
    - "frontend/package-lock.json"
    - "frontend/tsconfig.json"
    - "frontend/vite.config.ts"
    - "frontend/tailwind.config.ts"
    - "frontend/postcss.config.js"
    - "tests"
    - "backend/tests"
    - "monitoring"
    - "pytest.ini"
    - "requirements-dev.txt"
    - "create_stress_test.py"
    - "generate_stress_test.py"
    - "setup_demo_lineage.py"
    - "setup_full_demo.py"
    - "setup.sql"
    - "grant_app_access.sh"
    - "grant_build_source_access.sh"
    - "testbed"
    - "*.png"
    - "ss_*"
    - "screenshot_*"
    - ".env"
    - ".env.*"
    - "*.pem"
    - "*.key"
    - "table_dependancy_graph"
    - "worspace_details_access_tokens"
    - "CODEOWNERS"
    - ".github"

targets:
  dev:
    mode: development
    default: true
    # Host comes from CLI profile:
    #   databricks bundle deploy -t dev --profile <profile> --var warehouse_id=<id>
    variables:
      rate_limit_max_requests: "200"  # higher cap for dev (admin dashboard polls every 10s)
      app_name: "bricktrace-dev"
    resources:
      apps:
        bricktrace:
          name: ${var.app_name}
          description: "BrickTrace — Interactive Unity Catalog lineage visualization"
          source_code_path: .
          resources:
            - name: sql-warehouse
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: CAN_USE
          config:
            command:
              - uvicorn
              - backend.main:app
              - --host
              - 0.0.0.0
              - --port
              - "8000"
            env:
              - name: DATABRICKS_WAREHOUSE_ID
                value: ${var.warehouse_id}
              - name: CACHE_TTL_SECONDS
                value: ${var.cache_ttl_seconds}
              - name: CACHE_MAX_MEMORY_MB
                value: ${var.cache_max_memory_mb}
              - name: ADMIN_GROUP_NAME
                value: ${var.admin_group_name}
              - name: RATE_LIMIT_MAX_REQUESTS
                value: ${var.rate_limit_max_requests}
              - name: RATE_LIMIT_WINDOW_SECONDS
                value: ${var.rate_limit_window_seconds}
              - name: LINEAGE_WINDOW_DAYS
                value: ${var.lineage_window_days}
              - name: COST_CACHE_TTL_SECONDS
                value: ${var.cost_cache_ttl_seconds}
              - name: LINEAGE_CATALOG
                value: ${var.lineage_catalog}
              - name: LINEAGE_SCHEMA
                value: ${var.lineage_schema}
              # Portable path to the deployed run_pipeline notebook — workspace.file_path
              # auto-resolves per-user, so this is team-safe and never empty.
              # If this env var is unset/empty at runtime, the backend will fall back to
              # discovering the path from the App's source_code_path (apps.get API).
              - name: PIPELINE_NOTEBOOK_PATH
                value: ${workspace.file_path}/notebooks/run_pipeline
              - name: CAPTURED_PLANS_TABLE
                value: ${var.captured_plans_table}
              - name: CAPTURED_CDC_TABLE
                value: ${var.captured_cdc_table}
              - name: TRANSFORM_CACHE_TTL_SECONDS
                value: ${var.transform_cache_ttl_seconds}
              - name: BUILD_CACHE_TTL_HOURS
                value: ${var.build_cache_ttl_hours}
              # --- Load, cost and data-boundary controls -------------------
              # Admission control between the app's threads and the warehouse.
              # Without it the app presents far more concurrent statements than a
              # warehouse runs, and a QUEUED statement still holds an app thread for
              # up to 170s — turning warehouse queuing into app-wide timeouts.
              - name: WAREHOUSE_MAX_CONCURRENT_STATEMENTS
                value: ${var.warehouse_max_concurrent_statements}
              # Makes Unity Catalog the read perimeter instead of the Apps ACL.
              # OFF by default because switching it on narrows what users see.
              - name: ENFORCE_USER_IDENTITY
                value: ${var.enforce_user_identity}
              - name: LINEAGE_HOP_MAX_ROWS
                value: ${var.lineage_hop_max_rows}
              # Serverless spend ceilings. The admin gate stops non-admins spending;
              # these stop a loop or a bulk pass spending without a ceiling.
              - name: MAX_BUILDS_IN_FLIGHT
                value: ${var.max_builds_in_flight}
              - name: MAX_BUILDS_PER_DAY
                value: ${var.max_builds_per_day}
              - name: LLM_MAX_CALLS_PER_USER_PER_DAY
                value: ${var.llm_max_calls_per_user_per_day}

  prod:
    mode: production
    # Host comes from CLI profile:
    #   databricks bundle deploy -t prod --profile <profile> --var warehouse_id=<id>
    resources:
      apps:
        bricktrace:
          name: ${var.app_name}
          description: "BrickTrace — Interactive Unity Catalog lineage visualization"
          source_code_path: .
          resources:
            - name: sql-warehouse
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: CAN_USE
          config:
            command:
              - uvicorn
              - backend.main:app
              - --host
              - 0.0.0.0
              - --port
              - "8000"
            env:
              - name: DATABRICKS_WAREHOUSE_ID
                value: ${var.warehouse_id}
              - name: CACHE_TTL_SECONDS
                value: ${var.cache_ttl_seconds}
              - name: CACHE_MAX_MEMORY_MB
                value: ${var.cache_max_memory_mb}
              - name: ADMIN_GROUP_NAME
                value: ${var.admin_group_name}
              - name: RATE_LIMIT_MAX_REQUESTS
                value: ${var.rate_limit_max_requests}
              - name: RATE_LIMIT_WINDOW_SECONDS
                value: ${var.rate_limit_window_seconds}
              - name: LINEAGE_WINDOW_DAYS
                value: ${var.lineage_window_days}
              - name: COST_CACHE_TTL_SECONDS
                value: ${var.cost_cache_ttl_seconds}
              - name: LINEAGE_CATALOG
                value: ${var.lineage_catalog}
              - name: LINEAGE_SCHEMA
                value: ${var.lineage_schema}
              # Portable path to the deployed run_pipeline notebook — workspace.file_path
              # auto-resolves per-user, so this is team-safe and never empty (an empty
              # value here previously broke the Apps config update).
              - name: PIPELINE_NOTEBOOK_PATH
                value: ${workspace.file_path}/notebooks/run_pipeline
              - name: CAPTURED_PLANS_TABLE
                value: ${var.captured_plans_table}
              - name: CAPTURED_CDC_TABLE
                value: ${var.captured_cdc_table}
              - name: TRANSFORM_CACHE_TTL_SECONDS
                value: ${var.transform_cache_ttl_seconds}
              - name: BUILD_CACHE_TTL_HOURS
                value: ${var.build_cache_ttl_hours}
              # --- Load, cost and data-boundary controls -------------------
              # Admission control between the app's threads and the warehouse.
              # Without it the app presents far more concurrent statements than a
              # warehouse runs, and a QUEUED statement still holds an app thread for
              # up to 170s — turning warehouse queuing into app-wide timeouts.
              - name: WAREHOUSE_MAX_CONCURRENT_STATEMENTS
                value: ${var.warehouse_max_concurrent_statements}
              # Makes Unity Catalog the read perimeter instead of the Apps ACL.
              # OFF by default because switching it on narrows what users see.
              - name: ENFORCE_USER_IDENTITY
                value: ${var.enforce_user_identity}
              - name: LINEAGE_HOP_MAX_ROWS
                value: ${var.lineage_hop_max_rows}
              # Serverless spend ceilings. The admin gate stops non-admins spending;
              # these stop a loop or a bulk pass spending without a ceiling.
              - name: MAX_BUILDS_IN_FLIGHT
                value: ${var.max_builds_in_flight}
              - name: MAX_BUILDS_PER_DAY
                value: ${var.max_builds_per_day}
              - name: LLM_MAX_CALLS_PER_USER_PER_DAY
                value: ${var.llm_max_calls_per_user_per_day}
